[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heli-xp-farmer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pydirectinput>=1.0.4",
    "pynput>=1.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.17"]

[project.scripts]
heli-farmer = "heli_farmer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["videos: Abgleich mit Daniels Videos in wardogs_daten/ (langsam, nur lokal)"]
addopts = "-m 'not videos'"
